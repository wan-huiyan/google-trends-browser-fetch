    <rect x="7"  y="42" width="42" height="14" fill="#E36AA8"/>
    <!-- waving hand (raised on right) -->
    <rect x="56" y="28" width="7" height="7" fill="#FFDAB9"/>
    <rect x="56" y="21" width="7" height="7" fill="#FFDAB9"/>
  </g>
  <text x="798" y="360" text-anchor="middle" font-size="11" fill="#C73E80" font-weight="bold">katie ✨</text>

  <!-- Sparkles around Kate -->
  <g fill="#FFD700">
    <rect x="844" y="280" width="3" height="3"/>
    <rect x="841" y="283" width="3" height="3"/>
    <rect x="847" y="283" width="3" height="3"/>
    <rect x="844" y="286" width="3" height="3"/>
  </g>
  <g fill="#FFD700">
    <rect x="755" y="305" width="3" height="3"/>
    <rect x="752" y="308" width="3" height="3"/>
    <rect x="758" y="308" width="3" height="3"/>
    <rect x="755" y="311" width="3" height="3"/>
  </g>
  <g fill="#FFD700">
    <rect x="855" y="320" width="3" height="3"/>
    <rect x="852" y="323" width="3" height="3"/>
    <rect x="858" y="323" width="3" height="3"/>
    <rect x="855" y="326" width="3" height="3"/>
  </g>

  <!-- Footer caption -->
  <text x="460" y="408" text-anchor="middle" font-size="10" fill="#888" font-style="italic">same chunking + stitching algorithm under the hood — katie wrapped it in a server so you never have to click "download" again</text>
</svg>
