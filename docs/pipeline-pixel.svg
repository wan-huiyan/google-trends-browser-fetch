<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="monospace">
  <defs>
    <marker id="ar-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4A9EDA"/>
    </marker>
    <marker id="ar-pink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E36AA8"/>
