    <rect x="7"  y="42" width="7" height="7"  fill="#E36AA8"/>
    <rect x="17" y="35" width="7" height="14" fill="#E36AA8"/>
    <rect x="27" y="28" width="7" height="21" fill="#E36AA8"/>
    <rect x="37" y="21" width="7" height="28" fill="#E36AA8"/>
    <rect x="47" y="14" width="7" height="35" fill="#E36AA8"/>
    <line x1="7" y1="49" x2="56" y2="49" stroke="#888" stroke-width="1"/>
  </g>
  <text x="632" y="360" text-anchor="middle" font-size="11" fill="#444">fresh dashboard</text>
  <text x="632" y="374" text-anchor="middle" font-size="9" fill="#888">every morning</text>

  <!-- Kate character on the right, waving -->
  <g transform="translate(770,275)">
    <!-- hair (long brown) -->
    <rect x="14" y="0"  width="28" height="7"  fill="#8B5E3C"/>
    <rect x="7"  y="7"  width="42" height="7"  fill="#8B5E3C"/>
    <rect x="0"  y="14" width="7"  height="21" fill="#8B5E3C"/>
    <rect x="49" y="14" width="7"  height="21" fill="#8B5E3C"/>
    <!-- face -->
